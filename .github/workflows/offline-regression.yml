name: Offline regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test repair runtime, AWS evidence and export boundaries offline
        run: |
          python3 -I -S -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check deterministic web assets
        run: python3 -I -S scripts/build_web.py --check

      - name: Check JavaScript evidence contracts
        run: node --test tests/test_*.cjs

      - name: Execute the selected repair and independent application
        run: |
          python3 -I -S scripts/test_repair.py --candidate business-key --case crash-retry --output .ci-out/repaired.json
          python3 tests/repair_holdout/run_transfer.py --output-dir .ci-out/transfer

      - name: Preserve the full comparison's explicit unresolved control
        shell: bash
        run: |
          set +e
          python3 -I -S scripts/test_repair.py --output .ci-out/complete-comparison.json
          result=$?
          set -e
          test "$result" -eq 3

      - name: Verify the frozen independent fixture
        run: python3 tests/repair_holdout/verify_freeze.py
